<p-dialog 
    [header]="header()" 
    [modal]="true" 
    [(visible)]="visible" 
    [style]="{ width: '420px', 'max-width': '90vw' }"
    [draggable]="false"
    [resizable]="false"
    (onHide)="cerrarDialog()">

    <form [formGroup]="form" class="form-moderno">
        <div id="contenedor-formulario">

            <div class="campo-grupo">
                <label for="descripcion" class="label-moderno">Descripción de la Tarea</label>
                <input 
                    pInputText 
                    type="text" 
                    id="descripcion" 
                    placeholder="Ej. Configurar servidor de testing" 
                    formControlName="descripcion" />
            </div>

            <div class="campo-grupo">
                <label for="idColumna" class="label-moderno">Columna / Estado</label>
                <p-select 
                    id="idColumna" 
                    formControlName="idColumna" 
                    [options]="columnas()" 
                    optionLabel="nombre"
                    optionValue="id"
                    placeholder="Seleccionar columna" 
                    appendTo="body" 
                    />
            </div>

            <div class="campo-grupo">
                <label for="prioridad" class="label-moderno">Prioridad</label>
                <p-select 
                    id="prioridad" 
                    formControlName="prioridad" 
                    [options]="prioridades" 
                    optionLabel="label" 
                    optionValue="value"
                    placeholder="Sin prioridad" 
                    appendTo="body" />
            </div>

            <div class="campo-grupo">
                <label for="responsable" class="label-moderno">Responsable</label>
                <input 
                    pInputText 
                    type="text" 
                    id="responsable" 
                    placeholder="Ej. Juan Pérez" 
                    formControlName="responsable" />
            </div>

            <div class="campo-grupo">
                <label for="idMetaIntermedia" class="label-moderno">Meta Intermedia</label>
               <p-select 
                id="idMetaIntermedia" 
                formControlName="idMetaIntermedia" 
                [options]="metas()" 
                optionLabel="nombre"
                optionValue="id"
                placeholder="Seleccionar meta"
                [showClear]="true"
                appendTo="body"
                scrollHeight="400px" />
            </div>

            <div class="campo-grupo">
                <label for="fechaEntrega" class="label-moderno">Fecha de Entrega</label>
                <input 
                    type="date" 
                    id="fechaEntrega" 
                    formControlName="fechaEntrega"
                    class="p-inputtext"
                    style="width: 100%;" />
            </div>
            
            <div class="form-acciones">
                <button 
                    pButton 
                    type="button" 
                    label="Cancelar" 
                    severity="secondary" 
                    [text]="true" 
                    (click)="cerrarDialog()">
                </button>
                <button 
                    pButton 
                    type="submit" 
                    id="guardar"
                    label="Guardar Tarea" 
                    icon="pi pi-check" 
                    (click)="guardarTarea()">
                </button>
            </div>

        </div>
    </form>
</p-dialog>
