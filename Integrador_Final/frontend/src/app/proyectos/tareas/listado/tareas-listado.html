<app-template>
    <div class="page-container">
        
        <div class="card-resumen">
            <div class="resumen-info-grid">
                <div class="info-block">
                    <span class="info-label">Proyecto</span>
                    <span class="info-value font-semibold">{{ proyecto()?.nombre }}</span>
                </div>
                @if (proyecto()?.cliente) {
                    <div class="info-block border-l">
                        <span class="info-label">Cliente</span>
                        <span class="info-value">{{ proyecto()?.cliente }}</span>
                    </div>
                }
                <div class="info-block border-l">
                    <span class="info-label">Estado</span>
                    <span class="badge-estado activo">{{ proyecto()?.estado }}</span>
                </div>
            </div>
        </div>

        <div class="page-header">
            <div>
                <h2 class="page-title">Tareas</h2>
                <p class="page-subtitle">Tareas del proyecto.</p>
            </div>
            
            <div class="botones-accion">
                <p-button 
                    id="boton-crear-tarea" 
                    icon="pi pi-plus" 
                    label="Crear Tarea" 
                    styleClass="btn-primario btn-crear"
                    (click)="crearTarea()">
                </p-button>

                <div class="separador-vertical"></div>
                
                <p-button
                    icon="pi pi-file-excel"   
                    styleClass="btn-exportar-compacto"  
                    pTooltip="Exportar a Excel"
                    tooltipPosition="bottom"
                    (click)="exportarExcel()">
                </p-button>

                <p-button
                    icon="pi pi-file-export"   
                    styleClass="btn-exportar-csv"  
                    pTooltip="Exportar a CSV"
                    tooltipPosition="bottom"
                    (click)="exportarCSV()">
                </p-button>
            </div>
        </div>

        <!-- Tabla de tareas -->
        <div class="tabla-wrapper">
            <p-table 
                id="tabla" 
                [value]="tareas()" 
                [scrollable]="true"
                scrollHeight="calc(100vh - 380px)">
                <ng-template #header>
                    <tr>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th class="text-right">Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-tarea>
                    <tr>
                        <td class="font-medium">{{ tarea.descripcion }}</td>
                        <td>
                            <span class="badge-estado" 
                            [class.estado-activo]="tarea.estado === 'PENDIENTE'"
                            [class.estado-completado]="tarea.estado === 'FINALIZADA'"
                            [class.estado-baja]="tarea.estado === 'BAJA'">
                        {{ tarea.estado }}
                        </span>
                        </td>
                        <td class="text-right table-actions">
                            <p-button 
                                icon="pi pi-pencil" 
                                [text]="true"
                                pTooltip="Editar Tarea" 
                                tooltipPosition="top"
                                (click)="editarTarea(tarea)">
                            </p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #emptymessage>
                    <tr>
                        <td colspan="3" class="tabla-vacia">
                            <i class="pi pi-check-square empty-icon"></i>
                            <p>No hay tareas creadas para este proyecto todavía.</p>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</app-template>

<app-gestion-tarea [(visible)]="dialogVisible" [idProyecto]="idProyecto()" [(tareaSeleccionada)]="tareaSeleccionada"></app-gestion-tarea>
