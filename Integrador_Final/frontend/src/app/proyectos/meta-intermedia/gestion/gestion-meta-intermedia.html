<p-dialog
    [header]="header()"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '450px' }"
    (onHide)="cerrar()">
    
    <form [formGroup]="form" class="form-moderno">
        <div class="campo-grupo">
            <label class="label-moderno">Nombre de la meta</label>
            <input pInputText formControlName="nombre" />
        </div>
        <div class="campo-grupo">
            <label class="label-moderno">Descripción (opcional)</label>
            <textarea pTextarea rows="3" formControlName="descripcion"></textarea>
        </div>
        <div class="form-acciones">
            <button pButton type="button" label="Cancelar" severity="secondary" [text]="true" (click)="cerrar()"></button>
            <button pButton type="button" id="guardar" label="Guardar" icon="pi pi-check" (click)="guardar()"></button>
        </div>
    </form>
</p-dialog>
