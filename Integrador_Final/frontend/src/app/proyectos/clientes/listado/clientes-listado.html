<p-dialog 
    header="Clientes" 
    [modal]="true" 
    [(visible)]="visible" 
    [style]="{ width: '85vw', maxWidth: '1200px', minWidth: '800px' }"
    [draggable]="false"
    [resizable]="false"
    [contentStyle]="{ 'padding': '1.5rem' }">
    
    <div class="page-container">
        <div class="page-header">
            <div>
                <p class="page-subtitle">Visualizá y administrá las firmas asociadas a tus proyectos.</p>
            </div>
        <div class="botones-accion">
                        <p-button 
                            id="boton-crear-cliente" 
                            icon="pi pi-plus" 
                            label="Crear Cliente" 
                            styleClass="btn-primario btn-crear"
                            (click)="crearCliente()">
                        </p-button>

                        <div class="separador-vertical"></div>
                        
                        <p-button
                            icon="pi pi-file-excel"   
                            styleClass="btn-exportar-compacto"  
                            pTooltip="Exportar a Excel"
                            tooltipPosition="bottom"
                            (click)="exportarExcel()">
                        </p-button>

                        <p-button
                            icon="pi pi-file-export"   
                            styleClass="btn-exportar-csv"  
                            pTooltip="Exportar a CSV"
                            tooltipPosition="bottom"
                            (click)="exportarCSV()">
                        </p-button>
                    </div>
                </div>

        <div class="tabla-wrapper">
            <p-table 
                id="tabla" 
                [value]="clientes()" 
                [scrollable]="true"
                scrollHeight="450px">
                <ng-template #header>
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Telefono</th>
                        <th>Email</th>
                        <th class="text-right">Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-cliente>
                    <tr>
                        <td class="font-medium">{{ cliente.nombre }}</td>
                        <td>
                            <span class="badge-estado" [class.activo]="cliente.estado === 'ACTIVO'">
                                {{ cliente.estado }}
                            </span>
                        </td>
                        <td>{{ cliente.telefono }}</td>
                        <td>{{ cliente.email }}</td>
                        <td class="text-right table-actions">
                            <p-button 
                                icon="pi pi-pencil" 
                                [text]="true"
                                pTooltip="Editar Cliente" 
                                tooltipPosition="top"
                                (click)="editarCliente(cliente)">
                            </p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #emptymessage>
                    <tr>
                        <td colspan="5" class="tabla-vacia">
                            <i class="pi pi-users empty-icon"></i>
                            <p>No se encontraron clientes registrados.</p>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</p-dialog>

<app-gestion-cliente [(visible)]="dialogVisible" [(clienteSeleccionado)]="clienteSeleccionado"></app-gestion-cliente>
