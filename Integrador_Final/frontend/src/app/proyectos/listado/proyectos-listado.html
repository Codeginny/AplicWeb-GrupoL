<app-template>
    <div class="page-container">
        <div class="page-header">
        <div>
            <h2 class="page-title">Proyectos</h2>
            <p class="page-subtitle">Gestion de proyectos...</p>
        </div>

        <div style="display:flex; gap:8px; align-items:center;">

        <div class="botones-accion">
            <p-button
                icon="pi pi-plus"
                label="Crear Proyecto"
                styleClass="btn-primario btn-crear"
                (click)="crearProyecto()">
            </p-button>

            <div class="separador-vertical"></div>
            
            <p-button
                icon="pi pi-file-excel"   
                styleClass="btn-exportar-compacto"  
                pTooltip="Exportar a Excel"
                tooltipPosition="bottom"
                (click)="exportarExcel()">
            </p-button>

            <p-button
                icon="pi pi-file-export"   
                styleClass="btn-exportar-csv"  
                pTooltip="Exportar a CSV"
                tooltipPosition="bottom"
                (click)="exportarCSV()">
            </p-button>

        </div>

        </div>
        </div>

        <div class="tabla-wrapper">
            <p-table 
                id="tabla" 
                [value]="proyectos()">
                <ng-template #header>
                    <tr>
                        <th>Nombre</th>
                        <th>Cliente</th>
                        <th>Fin Objetivo</th>
                        <th>Plazo</th>
                        <th>Estado</th>
                        <th class="text-right">Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-proyecto>
                    <tr>
                        <td class="font-medium text-slate-900">{{ proyecto.nombre }}</td>
                        <td>
                            <div class="cliente-cell">
                                <i class="pi pi-briefcase cliente-icono"></i>
                                <p-select
                                    [options]="clientes()"
                                    optionLabel="nombre"
                                    optionValue="id"
                                    [ngModel]="proyecto.cliente?.id ?? null"
                                    (onChange)="cambiarCliente(proyecto, $event)"
                                    placeholder="Sin asignar"
                                    [showClear]="false"
                                    styleClass="cliente-select-mini">
                                </p-select>
                            </div>
                        </td>
                        <td>{{ proyecto.fechaFinalizacionObjetivo | date:'dd/MM/yyyy'  }}</td>
                        <td>
                            <span class="badge-plazo" [class]="getClasePlazo(proyecto)">
                                {{ getTextoPlazo(proyecto) }}
                            </span>
                        </td>
                        <td>
                           <span class="badge-estado" 
                                [class.estado-activo]="proyecto.estado === 'ACTIVO'"
                                [class.estado-completado]="proyecto.estado === 'FINALIZADO'"
                                [class.estado-baja]="proyecto.estado === 'BAJA'">
                            {{ proyecto.estado }}
                            </span>
                        </td>
                        <td class="text-right table-actions">
                            <p-button 
                                id="boton-gestionar-tareas" 
                                icon="pi pi-list" 
                                [text]="true"
                                severity="primary"
                                pTooltip="Gestionar Tareas"
                                tooltipPosition="top"
                                (click)="gestionarTareas(proyecto)">
                            </p-button>
                            <p-button 
                                icon="pi pi-pencil" 
                                [text]="true"
                                severity="secondary"
                                pTooltip="Editar Proyecto"
                                tooltipPosition="top"
                                (click)="editarProyecto(proyecto)">
                            </p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #emptymessage>
                    <tr>
                        <td colspan="4" class="tabla-vacia">
                            <i class="pi pi-folder-open empty-icon"></i>
                            <p>No se encontraron proyectos activos.</p>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</app-template>

<app-gestion-proyecto [(visible)]="dialogVisible" [(proyectoSeleccionado)]="proyectoSeleccionado"></app-gestion-proyecto>
